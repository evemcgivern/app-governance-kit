name: release-please
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Opens and updates a release PR from the conventional commits on main. Merging that PR bumps
      # version.txt, updates CHANGELOG.md and the README version line, then tags and publishes the
      # release. PRs opened with the default token do not start other workflows. To have CI run on
      # the release PR, add a personal access token as the RELEASE_PLEASE_TOKEN secret.
      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
