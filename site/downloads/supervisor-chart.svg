n"><rect class="org-box" x="328" y="280" width="100" height="66" rx="8"/><text class="org-text" font-size="12.5" text-anchor="middle"><tspan x="378" y="309.875">Application</tspan><tspan x="378" y="324.875">rationalization</tspan></text></a><path class="org-line" d="M 486 250 V 271" aria-hidden="true"/><path class="org-arrow" d="M 481 272 L 491 272 L 486 280 Z" aria-hidden="true"/><a class="org-link" href="https://evemcgivern.github.io/app-governance-kit/tools.html#access-review" aria-label="Access review pack"><rect class="org-box" x="436" y="280" width="100" height="66" rx="8"/><text class="org-text" font-size="12.5" text-anchor="middle"><tspan x="486" y="309.875">Access review</tspan><tspan x="486" y="324.875">pack</tspan></text></a><path class="org-line" d="M 594 250 V 271" aria-hidden="true"/><path class="org-arrow" d="M 589 272 L 599 272 L 594 280 Z" aria-hidden="true"/><a class="org-link" href="https://evemcgivern.github.io/app-governance-kit/tools.html#ai-intake" aria-label="AI system intake and risk tiering"><rect class="org-box" x="544" y="280" width="100" height="66" rx="8"/><text class="org-text" font-size="12.5" text-anchor="middle"><tspan x="594" y="302.375">AI system</tspan><tspan x="594" y="317.375">intake and</tspan><tspan x="594" y="332.375">risk tiering</tspan></text></a><path class="org-line" d="M 702 250 V 271" aria-hidden="true"/><path class="org-arrow" d="M 697 272 L 707 272 L 702 280 Z" aria-hidden="true"/><a class="org-link" href="https://evemcgivern.github.io/app-governance-kit/tools.html#hardware-lifecycle" aria-label="Hardware lifecycle check"><rect class="org-box" x="652" y="280" width="100" height="66" rx="8"/><text class="org-text" font-size="12.5" text-anchor="middle"><tspan x="702" y="302.375">Hardware</tspan><tspan x="702" y="317.375">lifecycle</tspan><tspan x="702" y="332.375">check</tspan></text></a><path class="org-line" d="M 810 250 V 271" aria-hidden="true"/><path class="org-arrow" d="M 805 272 L 815 272 L 810 280 Z" aria-hidden="true"/><a class="org-link" href="https://evemcgivern.github.io/app-governance-kit/tools.html#audit-response" aria-label="Software audit response check"><rect class="org-box" x="760" y="280" width="100" height="66" rx="8"/><text class="org-text" font-size="12.5" text-anchor="middle"><tspan x="810" y="309.875">Software audit</tspan><tspan x="810" y="324.875">response check</tspan></text></a><path class="org-line" d="M 918 250 V 271" aria-hidden="true"/><path class="org-arrow" d="M 913 272 L 923 272 L 918 280 Z" aria-hidden="true"/><a class="org-link" href="https://evemcgivern.github.io/app-governance-kit/tools.html#software-lifecycle" aria-label="Software lifecycle check"><rect class="org-box" x="868" y="280" width="100" height="66" rx="8"/><text class="org-text" font-size="12.5" text-anchor="middle"><tspan x="918" y="302.375">Software</tspan><tspan x="918" y="317.375">lifecycle</tspan><tspan x="918" y="332.375">check</tspan></text></a><text class="org-text org-text--muted" font-size="12.5" text-anchor="start"><tspan x="510" y="236">Routes to these tools</tspan></text><text class="org-text org-text--muted" font-size="12" text-anchor="middle"><tspan x="918" y="364">The agent can&#x27;t run it:</tspan><tspan x="918" y="378">you run the tool.</tspan></text></g><g class="org-also"><path class="org-line org-line--dashed" d="M 918 250 H 994 V 450 H 960" aria-hidden="true"/><rect class="org-group" x="720" y="404" width="240" height="92" rx="10"/><text class="org-text org-text--muted" font-size="12.5" text-anchor="middle"><tspan x="840" y="424">Also in the kit</tspan></text><a class="org-link" href="https://evemcgivern.github.io/app-governance-kit/tools.html#cert-prep" aria-label="Certification study coach"><rect class="org-box" x="736" y="434" width="208" height="48" rx="8"/><text class="org-text" font-size="12.5" text-anchor="middle"><tspan x="840" y="455">Certification</tspan><tspan x="840" y="470">study coach</tspan></text></a></g></svg>
