<svg class="org-chart org-chart--wide" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 504" aria-labelledby="org-title-wide org-desc-wide"><title id="org-title-wide">Who does what: you, the supervisor, and the tools</title><desc id="org-desc-wide">You sit at the top: every decision stays with you. Below you is the supervisor, the application governance router skill and the app governance agent for Claude Code. It picks a tool, runs it, and decides nothing. Below the supervisor are the nine governance tools it routes to; each is a link to its card. Set apart in a dashed group, labeled Also in the kit, is the certification study coach, which the router also names. The cards below the chart give the same structure as text.</desc><style>
.org-box { fill: #ffffff; stroke: #767f89; stroke-width: 1.5; }
.org-box--you { fill: #eef3f5; }
.org-super { fill: #eef3f5; stroke: #1f4c5e; stroke-width: 2; }
.org-super-box { fill: #ffffff; stroke: #767f89; stroke-width: 1.5; }
.org-group { fill: none; stroke: #4d5762; stroke-width: 1.5; stroke-dasharray: 6 4; }
.org-line { fill: none; stroke: #4d5762; stroke-width: 1.5; }
.org-line--dashed { stroke-dasharray: 6 4; }
.org-arrow { fill: #4d5762; }
.org-text { fill: #1a212b; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 600; }
.org-text--muted { fill: #4d5762; font-weight: 400; }
.org-link .org-text { fill: #1f4c5e; }
.org-link { cursor: pointer; }
.org-link:hover .org-box, .org-link:hover .org-super-box { stroke: #1f4c5e; stroke-width: 2.5; }
.org-link:focus-visible { outline: 3px solid #1f4c5e; outline-offset: 2px; }
</style><g class="org-you"><rect class="org-box org-box--you" x="330" y="8" width="340" height="40" rx="8"/><text class="org-text" font-size="13.5" text-anchor="middle"><tspan x="500" y="32.375">You: every decision stays with you</tspan></text></g><path class="org-line" d="M 500 48 V 71" aria-hidden="true"/><path class="org-arrow" d="M 495 72 L 505 72 L 500 80 Z" aria-hidden="true"/><g class="org-supervisor"><rect class="org-super" x="100" y="80" width="800" height="124" rx="10"/><text class="org-text" font-size="13.5" text-anchor="middle"><tspan x="500" y="102">Supervisor: picks a tool, runs it, decides nothing</tspan></text><a class="org-link" href="https://evemcgivern.github.io/app-governance-kit/tools.html#app-governance" aria-label="Application governance router, a skill"><rect class="org-super-box" x="116" y="116" width="372" height="76" rx="8"/><text class="org-text" font-size="13.5" text-anchor="middle"><tspan x="302" y="142">Application governance router</tspan></text><text class="org-text org-text--muted" font-size="12.5" text-anchor="middle"><tspan x="302" y="162">A skill: picks the tool, asks for the data</tspan></text><text class="org-text org-text--muted" font-size="12.5" text-anchor="middle"><tspan x="302" y="180">Claude, Codex and Copilot</tspan></text></a><a class="org-link" href="https://evemcgivern.github.io/app-governance-kit/tools.html#supervisor-agent" aria-label="App governance agent, Claude Code, read-only, see its card"><rect class="org-super-box" x="512" y="116" width="372" height="76" rx="8"/><text class="org-text" font-size="13.5" text-anchor="middle"><tspan x="698" y="142">App governance agent</tspan></text><text class="org-text org-text--muted" font-size="12.5" text-anchor="middle"><tspan x="698" y="162">Claude Code agent, read-only</tspan></text><text class="org-text org-text--muted" font-size="12.5" text-anchor="middle"><tspan x="698" y="180">Loads the router skill</tspan></text></a></g><g class="org-tools"><path class="org-line" d="M